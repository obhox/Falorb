# Falorb — production stack for Coolify.
#
# Deployed as a Coolify "Docker Compose" resource pointed at this file. It is
# separate from infra/docker-compose.yml, which is a *development* file that
# publishes Postgres, Redis and ClickHouse on host ports with a well-known
# password. Deploying that file would put three unauthenticated databases on
# the public internet, so the two must never be confused.
#
# Differences that matter here:
#   - No `ports:` on any datastore. They are reachable only on the internal
#     compose network; Coolify's proxy is the sole ingress.
#   - Every secret comes from a Coolify-generated value. Nothing is hardcoded.
#   - Domains are assigned with SERVICE_FQDN_* magic variables, which Coolify
#     expands and wires into its proxy automatically.
#
# Coolify conventions used:
#   SERVICE_FQDN_<NAME>_<PORT>  publish a service at a domain
#   SERVICE_PASSWORD_<NAME>     generate and persist a random password
#   SERVICE_BASE64_64_<NAME>    generate a 64-byte base64 secret

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: falorb
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: falorb
    volumes:
      - falorb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falorb -d falorb"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly is not optional here: the ingest stream lives in Redis, and
    # without it a container restart drops every event not yet written to
    # ClickHouse.
    command: >-
      redis-server --appendonly yes
      --requirepass ${SERVICE_PASSWORD_REDIS}
      --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - falorb-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SERVICE_PASSWORD_REDIS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    # Built rather than pulled: the server config is baked into the image. It used
    # to arrive as bind mounts of infra/clickhouse/{config.d,users.d}, but Coolify
    # rewrites relative bind mounts into empty directories it manages, so the
    # overrides silently never reached the server. See Dockerfile.clickhouse.
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: falorb
      CLICKHOUSE_PASSWORD: ${SERVICE_PASSWORD_CLICKHOUSE}
      CLICKHOUSE_DB: falorb
    volumes:
      - falorb-clickhouse:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      # Tests the HTTP interface on 8123, not the native protocol. Everything that
      # actually talks to ClickHouse here -- migrate, ingest, api -- speaks HTTP, and
      # a clickhouse-client check passes over a loopback-only bind that refuses every
      # one of them. The check has to exercise the interface the callers use.
      test:
        - CMD-SHELL
        - >-
          wget -q -O - --header="X-ClickHouse-User: falorb"
          --header="X-ClickHouse-Key: ${SERVICE_PASSWORD_CLICKHOUSE}"
          "http://127.0.0.1:8123/?query=SELECT%201" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 20

  # --- migrations -------------------------------------------------------------
  # Runs to completion before the apps start, so no service ever queries a
  # schema that does not exist yet.
  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
      args:
        APP: db
    restart: "no"
    command: ["sh", "-c", "tsx src/migrate-all.ts"]
    environment:
      DATABASE_URL: postgresql://falorb:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/falorb
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: falorb
      CLICKHOUSE_PASSWORD: ${SERVICE_PASSWORD_CLICKHOUSE}
      CLICKHOUSE_DATABASE: falorb
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  # --- collector --------------------------------------------------------------
  ingest:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ingest
    restart: unless-stopped
    environment:
      # Own subdomain so an ad-blocker rule against the collector cannot take
      # the dashboard down with it.
      SERVICE_FQDN_INGEST_3001: /
      PORT: 3001
      DATABASE_URL: postgresql://falorb:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/falorb
      REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379
      FALORB_SALT_SECRET: ${SERVICE_BASE64_64_SALT}
      MAXMIND_DB_PATH: ${MAXMIND_DB_PATH:-}
      FALORB_RATE_LIMIT: ${FALORB_RATE_LIMIT:-600}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # --- background jobs --------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
      args:
        APP: worker
    restart: unless-stopped
    # No domain: the worker serves no HTTP and must not be reachable.
    environment:
      DATABASE_URL: postgresql://falorb:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/falorb
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: falorb
      CLICKHOUSE_PASSWORD: ${SERVICE_PASSWORD_CLICKHOUSE}
      CLICKHOUSE_DATABASE: falorb
      REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379
      FALORB_APP_URL: https://dashboard.${FALORB_DOMAIN}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

  # --- account & management API ------------------------------------------------
  api:
    # Declared so Traefik can infer which port to route to. Dockerfile.node is
    # shared by api, mcp, worker and migrate, which listen on different ports (or
    # none), so it carries no EXPOSE -- and without one the proxy answered
    # "no available server" for a container that was running perfectly.
    # Dockerfile.ingest has EXPOSE 3001, which is why ingest alone routed.
    expose:
      - "3003"
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
      args:
        APP: api
    restart: unless-stopped
    command: ["sh", "-c", "tsx src/index.ts"]
    environment:
      SERVICE_FQDN_API_3003: /
      PORT: 3003
      DATABASE_URL: postgresql://falorb:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/falorb
      BETTER_AUTH_SECRET: ${SERVICE_BASE64_64_AUTH}
      FALORB_API_URL: https://api.${FALORB_DOMAIN}
      FALORB_APP_URL: https://dashboard.${FALORB_DOMAIN}
      FALORB_INGEST_URL: https://a.${FALORB_DOMAIN}
      FALORB_MCP_URL: https://mcp.${FALORB_DOMAIN}/mcp
      # Load-bearing. better-auth rejects a session whose Origin is not listed
      # here, and CORS blocks the request before that — so a hostname typo
      # surfaces as "sign-in silently does nothing" rather than as an error.
      # Must match the dashboard's real origin exactly, scheme included.
      FALORB_TRUSTED_ORIGINS: https://dashboard.${FALORB_DOMAIN},https://${FALORB_DOMAIN}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

  # --- dashboard ---------------------------------------------------------------
  # This was missing entirely: the stack deployed the API, collector, worker and
  # MCP server but never the dashboard, while `infra/Caddyfile` proxied to a
  # `web:3000` that did not exist. The two files disagreed about what production
  # was, which is also how the security headers configured in the Caddyfile came
  # to be believed present and were in fact never served. They are now set by
  # the app itself (`apps/web/next.config.mjs` and `src/middleware.ts`), so they
  # hold whichever proxy is in front.
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
      args:
        APP: web
    restart: unless-stopped
    command: ["sh", "-c", "pnpm --filter @falorb/web start"]
    environment:
      SERVICE_FQDN_WEB_3000: /
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://falorb:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/falorb
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: falorb
      CLICKHOUSE_PASSWORD: ${SERVICE_PASSWORD_CLICKHOUSE}
      CLICKHOUSE_DATABASE: falorb
      # Must be byte-identical to the API's, or a session minted by one is
      # rejected by the other.
      BETTER_AUTH_SECRET: ${SERVICE_BASE64_64_AUTH}
      FALORB_APP_URL: https://dashboard.${FALORB_DOMAIN}
      FALORB_API_URL: https://api.${FALORB_DOMAIN}
      FALORB_INGEST_URL: https://a.${FALORB_DOMAIN}
      FALORB_MCP_URL: https://mcp.${FALORB_DOMAIN}/mcp
      FALORB_TRUSTED_ORIGINS: https://dashboard.${FALORB_DOMAIN},https://${FALORB_DOMAIN}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

  # --- MCP server --------------------------------------------------------------
  mcp:
    # Declared so Traefik can infer which port to route to. Dockerfile.node is
    # shared by api, mcp, worker and migrate, which listen on different ports (or
    # none), so it carries no EXPOSE -- and without one the proxy answered
    # "no available server" for a container that was running perfectly.
    # Dockerfile.ingest has EXPOSE 3001, which is why ingest alone routed.
    expose:
      - "3002"
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
      args:
        APP: mcp
    restart: unless-stopped
    command: ["sh", "-c", "tsx src/index.ts --http"]
    environment:
      SERVICE_FQDN_MCP_3002: /
      FALORB_MCP_PORT: 3002
      DATABASE_URL: postgresql://falorb:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/falorb
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: falorb
      CLICKHOUSE_PASSWORD: ${SERVICE_PASSWORD_CLICKHOUSE}
      CLICKHOUSE_DATABASE: falorb
      FALORB_INGEST_URL: https://a.${FALORB_DOMAIN}
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  falorb-postgres:
  falorb-redis:
  falorb-clickhouse:
