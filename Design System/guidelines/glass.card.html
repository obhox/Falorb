<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;height:170px;display:flex;align-items:center;background:var(--bg-shell);padding:0 22px;font-family:var(--font-sans)}
.f{display:flex;gap:0;width:100%}.g{display:grid;width:100%}
.sw{height:64px;display:flex;align-items:flex-end;padding:6px 7px;font-family:var(--font-mono);font-size:9px;color:var(--w-40)}
.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.lb{font-size:10px;text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--text-muted);font-weight:500}
</style></head><body><div style="position:relative;width:100%;height:120px;border-radius:var(--radius-panel);overflow:hidden;background:var(--surface-panel)">

<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:200px;padding:12px 14px;border-radius:var(--radius-card);background:var(--glass-bg);border:var(--glass-border);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--shadow-3)">

<div style="display:flex;justify-content:space-between;gap:20px;font-size:12px;color:var(--text-body)"><span>Visitors</span><span style="font-family:var(--font-mono);color:var(--text-primary)">33,800</span></div>
</div></div></body></html>
