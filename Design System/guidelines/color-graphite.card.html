<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;height:150px;display:flex;align-items:center;background:var(--bg-shell);padding:0 22px;font-family:var(--font-sans)}
.f{display:flex;width:100%;border-radius:var(--radius-3);overflow:hidden;border:1px solid var(--border-subtle)}
.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 5px;font-family:var(--font-mono);font-size:9px}
</style></head><body><div class="f">
<div class="sw" style="background:var(--ink-1000);color:rgba(255,255,255,.5)">1000</div>
<div class="sw" style="background:var(--ink-950);color:rgba(255,255,255,.5)">950</div>
<div class="sw" style="background:var(--ink-900);color:rgba(255,255,255,.5)">900</div>
<div class="sw" style="background:var(--ink-850);color:rgba(255,255,255,.5)">850</div>
<div class="sw" style="background:var(--ink-800);color:rgba(255,255,255,.5)">800</div>
<div class="sw" style="background:var(--ink-750);color:rgba(255,255,255,.5)">750</div>
<div class="sw" style="background:var(--ink-700);color:rgba(255,255,255,.55)">700</div>
<div class="sw" style="background:var(--ink-600);color:rgba(255,255,255,.55)">600</div>
<div class="sw" style="background:var(--ink-500);color:rgba(255,255,255,.6)">500</div>
<div class="sw" style="background:var(--ink-400);color:rgba(0,0,0,.5)">400</div>
<div class="sw" style="background:var(--ink-300);color:rgba(0,0,0,.5)">300</div>
<div class="sw" style="background:var(--ink-200);color:rgba(0,0,0,.5)">200</div>
<div class="sw" style="background:var(--ink-150);color:rgba(0,0,0,.5)">150</div>
<div class="sw" style="background:var(--ink-100);color:rgba(0,0,0,.5)">100</div>
<div class="sw" style="background:var(--ink-50);color:rgba(0,0,0,.5)">50</div>
<div class="sw" style="background:var(--ink-0);color:rgba(0,0,0,.5)">0</div>
</div></body></html>
