<!-- @dsCard group="Colors" viewport="700x150" name="Signal colours" subtitle="Deltas and status only — never decoration." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;height:150px;display:flex;align-items:center;background:var(--bg-shell);padding:0 22px;font-family:var(--font-sans)}
.f{display:flex;gap:0;width:100%}.g{display:grid;width:100%}
.sw{height:64px;display:flex;align-items:flex-end;padding:6px 7px;font-family:var(--font-mono);font-size:9px;color:var(--w-40)}
.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.lb{font-size:10px;text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--text-muted);font-weight:500}
</style></head><body><div class="g" style="gap:8px;grid-template-columns:repeat(3,1fr)">

<div style="display:grid;gap:6px">
 <div style="display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:var(--radius-2);background:var(--signal-up-dim);border:1px solid #5FD08A3d;color:#5FD08A;font-family:var(--font-mono);font-size:12px">+8.7%</div>
 <div class="k">--signal-up #5FD08A</div><div class="k" style="color:var(--ink-500)">Up / healthy</div>
</div>
<div style="display:grid;gap:6px">
 <div style="display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:var(--radius-2);background:var(--signal-down-dim);border:1px solid #F2748B3d;color:#F2748B;font-family:var(--font-mono);font-size:12px">-6.3%</div>
 <div class="k">--signal-down #F2748B</div><div class="k" style="color:var(--ink-500)">Down / error</div>
</div>
<div style="display:grid;gap:6px">
 <div style="display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:var(--radius-2);background:var(--signal-warn-dim);border:1px solid #E9B8723d;color:#E9B872;font-family:var(--font-mono);font-size:12px">sampled</div>
 <div class="k">--signal-warn #E9B872</div><div class="k" style="color:var(--ink-500)">Sampled / warning</div>
</div>
</div></body></html>
