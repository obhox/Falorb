<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;height:160px;display:flex;align-items:center;background:var(--bg-shell);padding:0 22px;font-family:var(--font-sans)}
.f{display:flex;gap:0;width:100%}.g{display:grid;width:100%}
.sw{height:64px;display:flex;align-items:flex-end;padding:6px 7px;font-family:var(--font-mono);font-size:9px;color:var(--w-40)}
.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.lb{font-size:10px;text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--text-muted);font-weight:500}
</style></head><body><div class="g" style="gap:10px">
<div class="f" style="border-radius:var(--radius-3);overflow:hidden">
<div class="sw" style="flex:1;background:var(--glacier-100);color:var(--k-64)">100</div><div class="sw" style="flex:1;background:var(--glacier-200);color:var(--k-64)">200</div><div class="sw" style="flex:1;background:var(--glacier-300);color:var(--k-64)">300</div><div class="sw" style="flex:1;background:var(--glacier-400);color:var(--k-64)">400</div><div class="sw" style="flex:1;background:var(--glacier-500);color:var(--w-64)">500</div><div class="sw" style="flex:1;background:var(--glacier-600);color:var(--w-64)">600</div><div class="sw" style="flex:1;background:var(--glacier-700);color:var(--w-64)">700</div><div class="sw" style="flex:1;background:var(--glacier-800);color:var(--w-64)">800</div><div class="sw" style="flex:1;background:var(--glacier-900);color:var(--w-64)">900</div>
</div>
<div class="k">--glacier-400 #7DD3FC is the default. 500+ for text on light, 100–300 for text on graphite.</div>
</div></body></html>
