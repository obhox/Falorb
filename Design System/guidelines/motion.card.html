<!-- @dsCard group="Brand" viewport="700x170" name="Motion" subtitle="Fluid settle, never bounce. Four durations, three curves." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;height:170px;display:flex;align-items:center;background:var(--bg-shell);padding:0 22px;font-family:var(--font-sans)}
.f{display:flex;gap:0;width:100%}.g{display:grid;width:100%}
.sw{height:64px;display:flex;align-items:flex-end;padding:6px 7px;font-family:var(--font-mono);font-size:9px;color:var(--w-40)}
.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.lb{font-size:10px;text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--text-muted);font-weight:500}
</style></head><body><div class="g" style="gap:10px">
<style>@keyframes fslide{0%{left:2px}50%{left:calc(100% - 62px)}100%{left:2px}}</style>
<div style="position:relative;height:34px;border-radius:var(--radius-control);background:var(--surface-inset);border:1px solid var(--control-border)">
<div style="position:absolute;top:2px;bottom:2px;width:60px;border-radius:var(--radius-3);background:var(--w-8);border:1px solid var(--w-8);animation:fslide 2.4s var(--ease-emphasis) infinite"></div>
</div>
<div class="f" style="gap:14px">
<div class="k">--dur-1 90 hover</div><div class="k">--dur-2 160 control</div><div class="k">--dur-3 240 panel</div><div class="k">--dur-4 420 chart</div>
</div>
<div class="k" style="color:var(--ink-500)">--ease-out (.2,.8,.25,1) · --ease-emphasis (.16,1,.3,1) · --ease-in-out (.4,0,.2,1)</div>
</div></body></html>
