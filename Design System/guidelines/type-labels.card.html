<!-- @dsCard group="Type" viewport="700x150" name="Micro labels" subtitle="11px uppercase, +6% tracking. Above every figure." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;height:150px;display:flex;align-items:center;background:var(--bg-shell);padding:0 22px;font-family:var(--font-sans)}
.f{display:flex;gap:0;width:100%}.g{display:grid;width:100%}
.sw{height:64px;display:flex;align-items:flex-end;padding:6px 7px;font-family:var(--font-mono);font-size:9px;color:var(--w-40)}
.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.lb{font-size:10px;text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--text-muted);font-weight:500}
</style></head><body><div class="g" style="gap:12px;grid-template-columns:repeat(3,1fr)">
<div style="display:grid;gap:6px">
<div class="lb">Unique visitors</div>
<div style="font-family:var(--font-mono);font-feature-settings:var(--tnum);font-size:26px;letter-spacing:-.03em;color:var(--metric-fg)">128,431</div>
</div><div style="display:grid;gap:6px">
<div class="lb">Median session</div>
<div style="font-family:var(--font-mono);font-feature-settings:var(--tnum);font-size:26px;letter-spacing:-.03em;color:var(--metric-fg)">2m 14s</div>
</div><div style="display:grid;gap:6px">
<div class="lb">Events / day</div>
<div style="font-family:var(--font-mono);font-feature-settings:var(--tnum);font-size:26px;letter-spacing:-.03em;color:var(--metric-fg)">86,204</div>
</div>
</div></body></html>
