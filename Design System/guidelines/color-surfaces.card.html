<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & text" subtitle="Four stacked surfaces, four text weights." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;height:150px;display:flex;align-items:center;background:var(--bg-shell);padding:0 22px;font-family:var(--font-sans)}
.f{display:flex;gap:0;width:100%}.g{display:grid;width:100%}
.sw{height:64px;display:flex;align-items:flex-end;padding:6px 7px;font-family:var(--font-mono);font-size:9px;color:var(--w-40)}
.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.lb{font-size:10px;text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--text-muted);font-weight:500}
</style></head><body><div class="g" style="grid-template-columns:1.2fr 1fr;gap:14px;align-items:center">
<div style="display:flex;gap:8px">
<div style="flex:1;height:66px;border-radius:var(--radius-3);background:var(--bg-app);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:6px;font-size:10px;color:var(--text-muted)">App</div><div style="flex:1;height:66px;border-radius:var(--radius-3);background:var(--surface-panel);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:6px;font-size:10px;color:var(--text-muted)">Panel</div><div style="flex:1;height:66px;border-radius:var(--radius-3);background:var(--surface-card);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:6px;font-size:10px;color:var(--text-muted)">Card</div><div style="flex:1;height:66px;border-radius:var(--radius-3);background:var(--surface-raised);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:6px;font-size:10px;color:var(--text-muted)">Raised</div>
</div>
<div style="display:grid;gap:3px">
<div style="font-size:13px;color:var(--text-primary)">--text-primary · headings, figures</div>
<div style="font-size:13px;color:var(--text-body)">--text-body · running copy</div>
<div style="font-size:13px;color:var(--text-secondary)">--text-secondary · labels</div>
<div style="font-size:13px;color:var(--text-muted)">--text-muted · units, hints</div>
</div>
</div></body></html>
