<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg-shell);padding:18px 20px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.lbl{font-size:11px;text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--text-muted);font-weight:500}.stack{display:grid;gap:14px}</style>
</head><body><div id="root"></div><script type="text/babel">
const NS = window.FalorbDesignSystem_c510a5;

const { Input, Select, Checkbox, Switch, Icon } = NS;
function Demo(){
 const [v,setV]=React.useState("app.example.com");
 const [sel,setSel]=React.useState("All properties");
 const [c1,setC1]=React.useState(true); const [c2,setC2]=React.useState(false);
 const [s1,setS1]=React.useState(true); const [s2,setS2]=React.useState(false);
 return(<div className="stack">
 <div className="row" style={{alignItems:"flex-start",gap:14}}>
   <Input label="Site domain" mono value={v} onChange={e=>setV(e.target.value)} iconLeft={<Icon name="globe" size={14}/>} style={{width:230}}/>
   <Input label="Search" placeholder="Filter people…" suffix="⌘K" style={{width:190}}/>
   <Input label="Retention" invalid value="0" hint="Must be at least 30 days." suffix="days" mono style={{width:150}}/>
 </div>
 <div className="row" style={{gap:14}}>
   <Select variant="bare" value={sel} options={["All properties","falorb.io","docs.falorb.io"]} onChange={setSel}/>
   <Select value="30d" options={["24h","7d","30d","12m"]} onChange={()=>{}}/>
   <Select size="sm" value="Sessions" options={["Sessions","Visitors","Events"]} onChange={()=>{}}/>
 </div>
 <div className="row" style={{gap:22}}>
   <Checkbox checked={c1} onChange={setC1} label="Respect Do Not Track"/>
   <Checkbox checked={c2} onChange={setC2} label="Sample above 1M events" description="Keeps p95 query time under 200ms."/>
   <Checkbox checked disabled label="Disabled"/>
   <Switch checked={s1} onChange={setS1} label="Person-level detail"/>
   <Switch size="sm" checked={s2} onChange={setS2} label="Beta features"/>
 </div>
 </div>);}

ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
