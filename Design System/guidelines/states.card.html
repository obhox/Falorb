<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;height:160px;display:flex;align-items:center;background:var(--bg-shell);padding:0 22px;font-family:var(--font-sans)}
.f{display:flex;gap:0;width:100%}.g{display:grid;width:100%}
.sw{height:64px;display:flex;align-items:flex-end;padding:6px 7px;font-family:var(--font-mono);font-size:9px;color:var(--w-40)}
.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.lb{font-size:10px;text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--text-muted);font-weight:500}
</style></head><body><div class="g" style="gap:10px">
<div class="f" style="gap:10px">
<div style="flex:1;display:grid;gap:7px;justify-items:center"><div style="width:100%;height:34px;border-radius:var(--radius-control);background:var(--control-bg);border:1px solid var(--control-border);box-shadow:var(--edge-top);transform:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-primary)">Export CSV</div><div class="k" style="font-size:9px">Rest</div></div><div style="flex:1;display:grid;gap:7px;justify-items:center"><div style="width:100%;height:34px;border-radius:var(--radius-control);background:var(--control-bg-hover);border:1px solid var(--control-border);box-shadow:var(--edge-top);transform:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-primary)">Export CSV</div><div class="k" style="font-size:9px">Hover</div></div><div style="flex:1;display:grid;gap:7px;justify-items:center"><div style="width:100%;height:34px;border-radius:var(--radius-control);background:var(--control-bg-active);border:1px solid var(--control-border);box-shadow:var(--edge-top);transform:translateY(.5px) scale(.994);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-primary)">Export CSV</div><div class="k" style="font-size:9px">Press</div></div><div style="flex:1;display:grid;gap:7px;justify-items:center"><div style="width:100%;height:34px;border-radius:var(--radius-control);background:var(--control-bg);border:1px solid rgba(125,211,252,.45);box-shadow:var(--focus-ring);transform:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-primary)">Export CSV</div><div class="k" style="font-size:9px">Focus</div></div>
</div>
<div class="k">Selected rows use --surface-selected (glacier 10%) + a hairline glacier border.</div>
</div></body></html>
