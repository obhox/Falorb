<!-- @dsCard group="Brand" viewport="700x160" name="Hatch & scrims" subtitle="Hatch = inactive volume. Scrim = text protection over data." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;height:160px;display:flex;align-items:center;background:var(--bg-shell);padding:0 22px;font-family:var(--font-sans)}
.f{display:flex;gap:0;width:100%}.g{display:grid;width:100%}
.sw{height:64px;display:flex;align-items:flex-end;padding:6px 7px;font-family:var(--font-mono);font-size:9px;color:var(--w-40)}
.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.lb{font-size:10px;text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--text-muted);font-weight:500}
</style></head><body><div class="g" style="grid-template-columns:1fr 1fr;gap:12px">
<div style="height:104px;border-radius:var(--radius-card);background:var(--surface-card);background-image:var(--hatch);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:8px"><span class="k">--hatch · 135° 1px/6px</span></div>
<div style="position:relative;height:104px;border-radius:var(--radius-card);overflow:hidden;background:var(--surface-card);background-image:var(--hatch);border:1px solid var(--border-subtle)">
<div style="position:absolute;inset:0;background:var(--scrim-bottom)"></div>
<span class="k" style="position:absolute;bottom:8px;left:8px;color:var(--text-primary)">--scrim-bottom</span>
</div>
</div></body></html>
