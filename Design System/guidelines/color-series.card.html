<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;height:150px;display:flex;align-items:center;background:var(--bg-shell);padding:0 22px;font-family:var(--font-sans)}
.f{display:flex;gap:0;width:100%}.g{display:grid;width:100%}
.sw{height:64px;display:flex;align-items:flex-end;padding:6px 7px;font-family:var(--font-mono);font-size:9px;color:var(--w-40)}
.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.lb{font-size:10px;text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--text-muted);font-weight:500}
</style></head><body><div class="g" style="gap:10px">
<div class="f" style="gap:8px;align-items:flex-end;height:70px">
<div style="flex:1;height:70px;background:#7DD3FC;border-radius:var(--radius-2)"></div><div style="flex:1;height:54px;background:#A7AFB8;border-radius:var(--radius-2)"></div><div style="flex:1;height:42px;background:#5A626B;border-radius:var(--radius-2)"></div><div style="flex:1;height:30px;background:#3D444B;border-radius:var(--radius-2)"></div><div style="flex:1;height:20px;background:#2E3338;border-radius:var(--radius-2)"></div>
</div>
<div class="f" style="gap:8px"><div class="k" style="flex:1">--series-1</div><div class="k" style="flex:1">--series-2</div><div class="k" style="flex:1">--series-3</div><div class="k" style="flex:1">--series-4</div><div class="k" style="flex:1">--series-5</div></div>
</div></body></html>
