<!-- @dsCard group="Spacing" viewport="700x160" name="Density" subtitle="Row heights and panel insets are fixed tokens, not judgement calls." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;height:160px;display:flex;align-items:center;background:var(--bg-shell);padding:0 22px;font-family:var(--font-sans)}
.f{display:flex;gap:0;width:100%}.g{display:grid;width:100%}
.sw{height:64px;display:flex;align-items:flex-end;padding:6px 7px;font-family:var(--font-mono);font-size:9px;color:var(--w-40)}
.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.lb{font-size:10px;text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--text-muted);font-weight:500}
</style></head><body><div class="g" style="gap:8px">
<div style="display:flex;align-items:center;gap:12px"><span class="k" style="width:160px">--row-height</span><span style="height:38px;width:114px;background:var(--w-6);border:1px solid var(--w-8);border-radius:var(--radius-2)"></span><span class="k" style="color:var(--ink-500)">38px · Default data row</span></div><div style="display:flex;align-items:center;gap:12px"><span class="k" style="width:160px">--row-height-dense</span><span style="height:30px;width:90px;background:var(--w-6);border:1px solid var(--w-8);border-radius:var(--radius-2)"></span><span class="k" style="color:var(--ink-500)">30px · Dense table / sidebar</span></div><div style="display:flex;align-items:center;gap:12px"><span class="k" style="width:160px">--pad-panel</span><span style="height:20px;width:60px;background:var(--w-6);border:1px solid var(--w-8);border-radius:var(--radius-2)"></span><span class="k" style="color:var(--ink-500)">20px · Panel interior</span></div><div style="display:flex;align-items:center;gap:12px"><span class="k" style="width:160px">--gutter-panel</span><span style="height:12px;width:36px;background:var(--w-6);border:1px solid var(--w-8);border-radius:var(--radius-2)"></span><span class="k" style="color:var(--ink-500)">12px · Gap between panels</span></div>
</div></body></html>
