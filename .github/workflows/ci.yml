name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Republish the images without pushing a commit — for rebuilding on a new
  # base image, or recovering from a failed publish.
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches infra/docker-compose.yml so local and CI behave identically.
  DATABASE_URL: postgresql://falorb:falorb@localhost:5432/falorb
  CLICKHOUSE_URL: http://localhost:8123
  CLICKHOUSE_USER: falorb
  CLICKHOUSE_PASSWORD: falorb
  CLICKHOUSE_DATABASE: falorb
  REDIS_URL: redis://localhost:6379
  FALORB_SALT_SECRET: ci-salt-secret-not-used-in-production
  BETTER_AUTH_SECRET: ci-auth-secret-not-used-in-production

jobs:
  # Static checks need no services, so they run first and fail fast — no point
  # spinning up three databases to discover a type error.
  static:
    name: Typecheck, tests, tracker size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

      - name: No known-vulnerable dependencies
        # The same reasoning as the tracker size budget below: a threshold only
        # holds if crossing it breaks the build. Six high-severity advisories
        # accumulated here unnoticed, including a SQL-injection fix that had
        # been deliberately declined while it was only a peer-range annoyance.
        # Failing on `high` keeps the gate actionable — moderate advisories in
        # build-time tooling are reported by `pnpm audit` without blocking.
        run: pnpm audit --audit-level=high
      - name: Build tracker
        run: pnpm --filter @falorb/tracker build
      - name: Enforce tracker size budget
        # The gate that stops the script on every customer's site growing
        # unnoticed. Failing the build is the entire point.
        run: pnpm --filter @falorb/tracker size

  integration:
    name: Migrations, queries, jobs
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: falorb
          POSTGRES_PASSWORD: falorb
          POSTGRES_DB: falorb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U falorb -d falorb"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:25.3-alpine
        env:
          CLICKHOUSE_USER: falorb
          CLICKHOUSE_PASSWORD: falorb
          CLICKHOUSE_DB: falorb
        ports: ["8123:8123"]
        options: >-
          --health-cmd "clickhouse-client --user falorb --password falorb --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The collector runs on Bun, and Bun is not preinstalled on the runner.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: |
          pnpm --filter @falorb/db migrate
          pnpm --filter @falorb/db ch:migrate

      - name: Seed projects and generate events
        run: |
          pnpm --filter @falorb/db seed
          pnpm --filter @falorb/db seed:events

      - name: Every query compiles and runs
        # Unit tests prove the filter compiler is safe; only ClickHouse can
        # prove the generated SQL is valid.
        run: pnpm --filter @falorb/queries smoke

      - name: Every worker job runs
        # Through pnpm, not `npx`. tsx is a devDependency of apps/worker and
        # pnpm does not hoist it to the root bin, so `npx tsx` from the repo
        # root cannot find it — every other step here already goes through
        # `pnpm --filter` for the same reason.
        run: pnpm --filter @falorb/worker verify:jobs

      - name: Workspace resolution keeps tenants apart
        # Which workspace resolves decides what every dashboard query is scoped
        # to, so a regression here is a cross-tenant read rather than a cosmetic
        # bug. Needs a real database, hence this job rather than the unit tests.
        run: pnpm --filter @falorb/db verify:workspace

      - name: Build tracker for the collector to serve
        run: pnpm --filter @falorb/tracker build

      # The load test posts to a live collector and asserts the events reach
      # ClickHouse, so both halves of the pipeline have to be running. Nothing
      # started them before, which is why the step failed with every request
      # rejected rather than with a real result.
      - name: Start the collector and worker
        run: |
          bun apps/ingest/src/index.ts > /tmp/ingest.log 2>&1 &
          pnpm --filter @falorb/worker start > /tmp/worker.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/health >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3001/health || { echo "collector never became healthy"; cat /tmp/ingest.log; exit 1; }

      - name: End-to-end event delivery, with zero loss
        run: node scripts/loadtest.mjs --events 2000 --concurrency 20

      - name: Collector and worker logs
        if: always()
        run: |
          echo "--- ingest ---"; tail -40 /tmp/ingest.log || true
          echo "--- worker ---"; tail -40 /tmp/worker.log || true

      - name: MCP server answers a real client
        run: pnpm --filter @falorb/mcp smoke

  # Images are built here rather than on the deployment server. Coolify used to
  # build them itself from `build:` sections in the production compose file,
  # which meant a production box compiling the whole workspace seven times on
  # every deploy, and meant the artifact that shipped had never been through
  # this pipeline. Now CI is the only thing that builds them, `needs` makes a
  # red test suite unpublishable, and the deploy is a pull.
  images:
    name: Publish ${{ matrix.image }}
    # Never from a pull request: a fork's PR must not be able to push an image
    # that Coolify would then pull.
    if: github.event_name != 'pull_request'
    needs: [static, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The one permission that lets GITHUB_TOKEN push to GHCR. Without it the
      # push fails on authentication even though the login succeeded.
      packages: write
    strategy:
      # One broken image should not cancel the six that would have succeeded —
      # a partial publish is easier to finish than to restart.
      fail-fast: false
      matrix:
        include:
          - image: falorb-ingest
            dockerfile: infra/docker/Dockerfile.ingest
          - image: falorb-clickhouse
            dockerfile: infra/docker/Dockerfile.clickhouse
          - image: falorb-web
            dockerfile: infra/docker/Dockerfile.web
          # The remaining four share Dockerfile.node and differ only in APP,
          # which selects the workspace package `pnpm deploy` prunes to. Same
          # file, four images — they cannot be one image with a runtime switch,
          # because the pruning happens at build time.
          - image: falorb-db
            dockerfile: infra/docker/Dockerfile.node
            app: db
          - image: falorb-api
            dockerfile: infra/docker/Dockerfile.node
            app: api
          - image: falorb-worker
            dockerfile: infra/docker/Dockerfile.node
            app: worker
          - image: falorb-mcp
            dockerfile: infra/docker/Dockerfile.node
            app: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercased for us — GHCR rejects an uppercase path, and the
          # repository is `obhox/Falorb`.
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.app && format('APP={0}', matrix.app) || '' }}
          # amd64 only. The target server is x86, and cross-building seven
          # images under QEMU costs more than the arm64 tags are worth.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per image, or the seven parallel jobs overwrite each other's
          # cache and every build starts from a cold pnpm install.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Coolify pulls; it no longer builds. This is what tells it there is
  # something new to pull.
  deploy:
    name: Trigger Coolify deployment
    if: github.event_name != 'pull_request'
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Call the Coolify deploy webhook
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        # Absent secrets are not a failure. A fork, or this repository before
        # anyone has wired up a server, still publishes usable images — it just
        # has nothing to redeploy.
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK_URL is unset — images are published, nothing was redeployed."
            exit 0
          fi
          curl -fsS -X GET "$WEBHOOK" -H "Authorization: Bearer $TOKEN"
