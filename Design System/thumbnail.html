<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>body{margin:0;width:1280px;height:854px;display:grid;grid-template-columns:1fr 300px;background:var(--ink-1000)}
.mark{display:flex;align-items:center;justify-content:center;background:var(--ink-1000);position:relative}
.mark span{font-family:var(--font-sans);font-weight:600;font-size:196px;letter-spacing:-.05em;color:var(--ink-0);line-height:1}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
.strip i{display:block}</style>
</head><body>
<div class="mark"><span>Falorb</span></div>
<div class="strip">
<i style="background:#C7EBFB"></i>
<i style="background:#7DD3FC"></i>
<i style="background:#46B6E8"></i>
<i style="background:#1C6D93"></i>
</div>
</body></html>
