name: falorb

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: falorb
      POSTGRES_PASSWORD: falorb
      POSTGRES_DB: falorb
    # Non-default host port: the target server already runs Postgres on 5432
    # for other projects.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falorb -d falorb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly makes the ingest stream survive a restart. Without it a
    # container bounce would drop every event not yet written to ClickHouse.
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: falorb
      CLICKHOUSE_PASSWORD: falorb
      CLICKHOUSE_DB: falorb
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # native protocol
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      # Writable on purpose: the image's entrypoint generates
      # users.d/default-user.xml here from CLICKHOUSE_USER/PASSWORD. Mounting
      # this read-only makes the container crash-loop on startup.
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # The alpine image ships neither curl nor wget, so probe with the
      # bundled client instead of an HTTP fetch.
      test:
        ["CMD", "clickhouse-client", "--user", "falorb", "--password", "falorb", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
